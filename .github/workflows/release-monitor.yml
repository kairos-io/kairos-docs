name: Release Monitor

on:
  schedule:
    # Check for new releases every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to process (optional)'
        required: false
        type: string
      dry_run:
        description: 'Dry run mode (no actual changes)'
        required: false
        type: boolean
        default: false

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up environment
        run: |
          chmod +x scripts/*.sh
          git config --global user.name "Kairos Release Bot"
          git config --global user.email "release-bot@kairos.io"

      - name: Run release automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Taken through the environment rather than interpolated into the
          # shell, so the value is a plain string to bash whatever it holds.
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # An array, because release-automation.sh reads one flag per
          # argument: a single string holding every flag arrives as one
          # argument and the script rejects it as an unknown option.
          args=(--verbose)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_VERSION" ]; then
              args+=(--version "$INPUT_VERSION")
            fi
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            fi
          fi
          ./scripts/release-automation.sh "${args[@]}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Release automation failed. Check the logs for details."
          # Add notification logic here (Slack, email, etc.)

